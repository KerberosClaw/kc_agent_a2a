name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux encryption tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y git-crypt
      - name: macOS encryption tool
        if: runner.os == 'macOS'
        run: brew list git-crypt || brew install git-crypt
      - run: python -m pip install --require-hashes -r scripts/discord_party/requirements.lock
      - run: python scripts/run_tests.py
      - run: PYTHONPATH=src python -m a2a.demo
      - run: python scripts/check_docs.py
